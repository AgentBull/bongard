[project]
name = "bongard"
version = "1.0.0"
description = "Bongard: an encoder-decoder System One model that returns probabilities, not text"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10,<2",
    "datasets>=4.3,<6",
    "pillow>=11,<13",
    "pyyaml>=6",
    "safetensors>=0.6",
    "sentencepiece>=0.2",
    "torch>=2.14,<3",
    "transformers==5.17.0",
]

[project.urls]
Homepage = "https://huggingface.co/AgentBull/bongard-mini"
Repository = "https://github.com/AgentBull/bongard"

[project.scripts]
bongard = "bongard.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=18"]
tracking = ["wandb>=0.21,<1"]
fp8 = ["torchao==0.17.0"]
transformer-engine = ["transformer-engine[pytorch]==2.19.0; platform_system == 'Linux'"]
flash = ["flash-attn-4[cu13]==4.0.0b32; platform_system == 'Linux'"]
peft = ["peft>=0.21,<0.22"]
bitsandbytes = ["bitsandbytes>=0.50.2,<0.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bongard"]
